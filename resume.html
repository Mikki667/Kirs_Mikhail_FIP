<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Resume</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <h1 class="hidden">My resume</h1>
    <header>
        <section class="grid-con">
            <h2 class="hidden">header</h2>

            <div class="col-span-4 m-col-span-4 l-col-span-4">
                <h2 class="header-name">Michael Kirs</h2>
            </div>

            <nav class="col-span-4 m-col-span-4 l-col-span-4 desktop-nav">
                <h2 class="hidden">desktop-nav</h2>
                <ul class="main-nav">
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="#about">About Me</a></li>
                    <li><a href="#projects">The Projects</a></li>
                    <li><a href="#contact">Contact Me</a></li>
                </ul>
            </nav>

            <div class="col-span-4 m-col-span-4 l-col-span-4">
                <div class="header-icons">
                    <h2 class="hidden">header-icons</h2>
                    <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
                    <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
                    <a href="#"><img src="images/github.png" alt="GitHub"></a>
                </div>
            </div>

            <button id="hamburger" class="mobile">&#9776;</button>

        </section>
    </header>

    <div id="menu" class="overlay">
        <h2 class="hidden">overlay</h2>
        <button id="close">&times;</button>

        <nav>
            <ul>
                <li><a href="index.html#home">Home</a></li>
                <li><a href="#about">About Me</a></li>
                <li><a href="#projects">The Projects</a></li>
                <li><a href="#contact">Contact Me</a></li>
            </ul>
        </nav>

        <div class="mobile-socials">

            <p>Follow me</p>

            <div class="social-icons-mobile">
                <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
                <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
                <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
                <a href="https://github.com/"><img src="images/github.png" alt="GitHub"></a>
            </div>
        </div>
    </div>

    <main>

        <section class="resume-section">
            <div class="grid-con">

                <div class="col-span-full">
                    <hr class="line-separator">
                    <h2 class="section-title">Resume</h2>
                </div>

                <div class="col-span-full resume-viewer">
                    <object data="files/resume.pdf" type="application/pdf" class="resume-pdf">
                        <p>Your browser cannot display the resume.
                            <a href="files/RESUME.pdf">Download it here.</a>
                        </p>
                    </object>
                </div>

                <div class="col-span-full resume-download-wrap">
                    <a href="files/resume.pdf" download class="resume-button">
                        Download PDF
                    </a>
                </div>

            </div>
        </section>

    </main>

    <footer class="footer">
        <section class="grid-con">
            <h2 class="hidden">footer</h2>

            <div class="col-span-4 m-col-span-4 l-col-span-4"></div>

            <div class="col-span-4 m-col-span-4 l-col-span-4 footer-center">
                <p class="footer-name">Michael Kirs</p>
            </div>

            <div class="col-span-4 m-col-span-4 l-col-span-4 footer-right">
                <a href="#"><img src="images/linkedin.png" class="footer-icon" alt="LinkedIn"></a>
                <a href="#"><img src="images/instagram.png" class="footer-icon" alt="Instagram"></a>
                <a href="#"><img src="images/youtube.png" class="footer-icon" alt="YouTube"></a>
                <a href="https://github.com/"><img src="images/github.png" class="footer-icon" alt="GitHub"></a>
            </div>
        </section>
    </footer>
</body>

</html>
